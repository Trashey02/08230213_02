<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Education Test</title>
  <link rel="stylesheet" href="test-edu.css">
</head>
<body>

<section class="education-section">
  <!-- Floating Blobs -->
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>

  <div class="education-container">
    <h2>📚 My Learning Journey</h2>
    <p class="edu-intro">
      A glimpse into my academic path, from my early schooling to higher education.
    </p>

    <!-- Carousel Wrapper -->
    <div class="carousel-wrapper">
      <!-- Left Arrow -->
      <button class="carousel-btn left">&#10094;</button>

      <!-- Cards -->
      <div class="edu-grid" id="eduGrid">
        <!-- Lower Secondary School (circle) -->
        <div class="edu-card shape-circle" style="background:#FFD700;">
          <img src="tlsslogo.jpg" alt="Tsebar Lower Secondary School Logo">
          <div class="edu-info">
            <h3>Lower Secondary</h3>
            <p><strong>Tsebar LSS</strong></p>
            <p>2008 – 2016</p>
          </div>
        </div>

        <!-- Middle School (rounded rectangle) -->
        <div class="edu-card shape-rounded-rect" style="background:#7FFFD4;">
          <img src="ycs.jpg" alt="Yurung Central School Logo">
          <div class="edu-info">
            <h3>Middle School</h3>
            <p><strong>Yurung CS</strong></p>
            <p>2017 – 2018</p>
          </div>
        </div>

        <!-- Secondary Level (hexagon) -->
        <div class="edu-card shape-hex" style="background:#FF69B4;">
          <img src="LGA.jpg" alt="Losel Gyatsho Academy Logo">
          <div class="edu-info">
            <h3>Secondary</h3>
            <p><strong>LGA</strong></p>
            <p>2019 – 2020</p>
          </div>
        </div>

        <!-- High School (diamond) -->
        <div class="edu-card shape-diamond" style="background:#87CEEB;">
          <img src="ua.png" alt="Ugyen Academy Logo">
          <div class="edu-info">
            <h3>High School</h3>
            <p><strong>Ugyen Academy</strong></p>
            <p>2022</p>
          </div>
        </div>

        <!-- College (rounded rectangle with shadow) -->
        <div class="edu-card shape-rounded-rect" style="background:#FFA07A;">
          <img src="scelogo.jpg" alt="Samtse College Logo">
          <div class="edu-info">
            <h3>B.Ed in IT</h3>
            <p><strong>Samtse College</strong></p>
            <p>2023 – Present</p>
          </div>
        </div>
      </div>

      <!-- Right Arrow -->
      <button class="carousel-btn right">&#10095;</button>
    </div>
  </div>
</section>

<!-- Carousel Scroll Script -->
<script>
const eduGrid = document.getElementById('eduGrid');
document.querySelector('.carousel-btn.left').addEventListener('click', () => {
  eduGrid.scrollBy({ left: -240, behavior: 'smooth' });
});
document.querySelector('.carousel-btn.right').addEventListener('click', () => {
  eduGrid.scrollBy({ left: 240, behavior: 'smooth' });
});
</script>

</body>
</html>
